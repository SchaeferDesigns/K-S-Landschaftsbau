<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Platzhaltergrafik: Team im Garten- und Landschaftsbau bei der Arbeit">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a28"/>
      <stop offset="60%" stop-color="#1d5a3c"/>
      <stop offset="100%" stop-color="#0a2317"/>
    </linearGradient>
    <linearGradient id="tGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c6f47"/>
      <stop offset="100%" stop-color="#173d29"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#tBg)"/>

  <circle cx="880" cy="220" r="150" fill="#8fd1a6" opacity="0.12"/>
  <circle cx="880" cy="220" r="72" fill="#cfe9d8" opacity="0.16"/>

  <path d="M0 560 C 200 520, 380 580, 600 556 C 820 532, 1000 588, 1200 552 L1200 900 L0 900 Z" fill="url(#tGround)"/>

  <!-- Baeume -->
