    <ellipse cx="158" cy="400" rx="104" ry="76" fill="#14432d"/>
    <rect x="1024" y="440" width="14" height="130" rx="6" fill="#0d2a1c"/>
    <ellipse cx="1031" cy="424" rx="86" ry="62" fill="#14432d"/>
  </g>

  <!-- Personen, abstrahiert -->
  <g fill="#e8e2d5">
    <g transform="translate(430 470)">
      <circle cx="0" cy="0" r="34" fill="#f0d9b8"/>
      <path d="M-46 190 C -46 96, -30 44, 0 44 C 30 44, 46 96, 46 190 Z" fill="#dcae4a"/>
      <rect x="-52" y="86" width="104" height="16" rx="8" fill="#c2963a"/>
      <path d="M-30 -12 C -30 -34, -14 -46, 0 -46 C 14 -46, 30 -34, 30 -12 Z" fill="#2a8a5c"/>
    </g>
    <g transform="translate(600 500)">
      <circle cx="0" cy="0" r="32" fill="#e6c6a3"/>
      <path d="M-44 170 C -44 84, -28 38, 0 38 C 28 38, 44 84, 44 170 Z" fill="#3f7f5c"/>
      <rect x="-50" y="76" width="100" height="14" rx="7" fill="#356a4d"/>
      <path d="M-28 -10 C -28 -32, -13 -44, 0 -44 C 13 -44, 28 -32, 28 -10 Z" fill="#dcae4a"/>
    </g>
    <g transform="translate(760 486)">
