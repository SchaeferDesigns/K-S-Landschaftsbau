<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Beispielgrafik: gestalteter Garten mit Terrasse, Weg und Bepflanzung">
  <defs>
    <linearGradient id="nSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb2d6"/>
      <stop offset="100%" stop-color="#dbe7ea"/>
    </linearGradient>
    <linearGradient id="nLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f8a52"/>
      <stop offset="100%" stop-color="#2a6b3d"/>
    </linearGradient>
    <linearGradient id="nTerrace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfc6b6"/>
      <stop offset="100%" stop-color="#a89e8d"/>
    </linearGradient>
    <filter id="nGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#nSky)"/>

  <!-- Haus -->
  <g>
    <rect x="1080" y="360" width="420" height="260" fill="#eee9df"/>
    <path d="M1050 362 L1290 236 L1530 362 Z" fill="#7c5b48"/>
    <rect x="1150" y="430" width="80" height="90" fill="#43606c"/>
    <rect x="1330" y="430" width="80" height="90" fill="#43606c"/>
    <rect x="1240" y="486" width="86" height="134" fill="#5c4636"/>
  </g>

  <!-- Geschnittene Hecke -->
  <rect x="0" y="466" width="900" height="146" rx="10" fill="#2f6b41"/>
  <rect x="0" y="466" width="900" height="26" rx="10" fill="#3c8150" opacity="0.75"/>

  <!-- Rasen -->
  <path d="M0 600 L1600 588 L1600 1000 L0 1000 Z" fill="url(#nLawn)"/>
  <g stroke="#357a48" stroke-width="16" opacity="0.35">
    <path d="M0 690 L1600 676"/>
    <path d="M0 800 L1600 786"/>
    <path d="M0 910 L1600 896"/>
  </g>

  <!-- Terrasse mit Plattenraster -->
  <g>
    <path d="M1020 1000 L1160 660 L1600 640 L1600 1000 Z" fill="url(#nTerrace)"/>
    <g stroke="#8d8477" stroke-opacity="0.45" stroke-width="3" fill="none">
      <path d="M1128 740 L1600 728"/>
      <path d="M1096 820 L1600 810"/>
      <path d="M1060 908 L1600 898"/>
      <path d="M1210 660 L1130 1000"/>
      <path d="M1300 656 L1250 1000"/>
      <path d="M1400 650 L1380 1000"/>
      <path d="M1500 646 L1500 1000"/>
    </g>
  </g>

  <!-- Gartenweg -->
  <path d="M980 1000 C 900 880, 760 800, 560 760 C 400 728, 300 700, 250 640" fill="none" stroke="#c9c0af" stroke-width="80" stroke-linecap="round" opacity="0.95"/>
  <path d="M980 1000 C 900 880, 760 800, 560 760 C 400 728, 300 700, 250 640" fill="none" stroke="#8d8477" stroke-width="80" stroke-linecap="round" opacity="0.18" stroke-dasharray="6 46"/>

  <!-- Staudenbeete -->
  <g>
    <ellipse cx="330" cy="820" rx="220" ry="70" fill="#245c37"/>
    <g fill="#4fa06a">
      <circle cx="240" cy="800" r="26"/>
      <circle cx="310" cy="786" r="32"/>
      <circle cx="392" cy="806" r="28"/>
      <circle cx="284" cy="836" r="24"/>
      <circle cx="372" cy="852" r="22"/>
    </g>
    <g fill="#c98a3e">
      <circle cx="268" cy="778" r="9"/>
      <circle cx="352" cy="792" r="8"/>
      <circle cx="322" cy="846" r="8"/>
    </g>
  </g>

  <g>
    <ellipse cx="1230" cy="640" rx="130" ry="34" fill="#245c37" opacity="0.9"/>
    <g fill="#57ad74">
      <circle cx="1180" cy="628" r="20"/>
      <circle cx="1236" cy="620" r="24"/>
      <circle cx="1292" cy="632" r="19"/>
    </g>
  </g>

  <!-- Solitaerbaum -->
  <g>
    <rect x="672" y="470" width="18" height="150" rx="8" fill="#5b4433"/>
    <ellipse cx="681" cy="440" rx="132" ry="96" fill="#2f7a4a"/>
    <ellipse cx="620" cy="470" rx="82" ry="58" fill="#378b55" opacity="0.9"/>
    <ellipse cx="744" cy="472" rx="76" ry="54" fill="#2a6b41" opacity="0.9"/>
  </g>

  <!-- Sitzmauer -->
  <g>
    <rect x="940" y="700" width="260" height="46" rx="8" fill="#b9ae9b"/>
    <rect x="940" y="700" width="260" height="12" rx="6" fill="#d3c9b6"/>
  </g>

  <!-- Gartenmoebel angedeutet -->
  <g fill="#4a4136" opacity="0.85">
    <rect x="1300" y="770" width="150" height="16" rx="6"/>
    <rect x="1312" y="786" width="12" height="46" rx="5"/>
    <rect x="1426" y="786" width="12" height="46" rx="5"/>
    <rect x="1268" y="800" width="42" height="12" rx="5"/>
    <rect x="1440" y="800" width="42" height="12" rx="5"/>
  </g>

  <rect width="1600" height="1000" filter="url(#nGrain)" opacity="0.05"/>
</svg>
