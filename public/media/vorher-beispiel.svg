<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Beispielgrafik: ungestalteter Garten vor der Umgestaltung">
  <defs>
    <linearGradient id="vSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa2ad"/>
      <stop offset="100%" stop-color="#c9cfc6"/>
    </linearGradient>
    <linearGradient id="vGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f8a5f"/>
      <stop offset="100%" stop-color="#5d6644"/>
    </linearGradient>
    <filter id="vGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#vSky)"/>

  <!-- Haus im Hintergrund -->
  <g>
    <rect x="1080" y="360" width="420" height="260" fill="#d8d2c6"/>
    <path d="M1050 362 L1290 236 L1530 362 Z" fill="#8a6a55"/>
    <rect x="1150" y="430" width="80" height="90" fill="#5d7079"/>
    <rect x="1330" y="430" width="80" height="90" fill="#5d7079"/>
    <rect x="1240" y="486" width="86" height="134" fill="#6b5644"/>
  </g>

  <!-- Nachbarhecke -->
  <rect x="0" y="470" width="900" height="140" rx="18" fill="#4f6b45" opacity="0.85"/>
  <rect x="0" y="470" width="900" height="30" rx="14" fill="#5c7a50" opacity="0.6"/>

  <!-- Ungepflegter Rasen -->
  <path d="M0 600 L1600 588 L1600 1000 L0 1000 Z" fill="url(#vGround)"/>

  <!-- Kahle Stellen -->
  <g fill="#7a6f4d" opacity="0.55">
    <ellipse cx="380" cy="760" rx="180" ry="48"/>
    <ellipse cx="900" cy="850" rx="230" ry="56"/>
    <ellipse cx="1360" cy="720" rx="150" ry="40"/>
  </g>

  <!-- Provisorische Platten -->
  <g fill="#a9a396" opacity="0.9">
    <rect x="1140" y="640" width="120" height="70" rx="4"/>
    <rect x="1290" y="662" width="120" height="70" rx="4"/>
    <rect x="1100" y="726" width="120" height="70" rx="4"/>
  </g>

  <!-- Alter Zaunrest -->
  <g stroke="#6f5b45" stroke-width="10" stroke-linecap="round">
    <path d="M120 600 L110 470"/>
    <path d="M300 604 L306 468"/>
    <path d="M480 600 L470 476"/>
    <path d="M100 520 L500 516" stroke-width="7" opacity="0.8"/>
  </g>

  <!-- Wildwuchs -->
  <g stroke="#4e5b34" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M640 1000 C 660 920, 630 880, 610 850"/>
    <path d="M690 1000 C 700 930, 686 890, 672 862"/>
    <path d="M200 980 C 214 916, 200 884, 186 858"/>
    <path d="M1500 990 C 1520 930, 1508 894, 1492 868"/>
  </g>

  <rect width="1600" height="1000" filter="url(#vGrain)" opacity="0.06"/>
</svg>
