<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Stilisierte Kartendarstellung des Standorts Mutlangen">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2b1e"/>
      <stop offset="100%" stop-color="#061711"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#mapBg)"/>

  <!-- Flurstuecke -->
  <g fill="#123825" opacity="0.85">
    <path d="M0 60 L210 20 L280 120 L90 170 Z"/>
    <path d="M320 0 L560 30 L520 140 L300 110 Z"/>
    <path d="M600 60 L800 20 L800 160 L620 180 Z"/>
    <path d="M40 300 L240 260 L300 380 L110 430 Z"/>
    <path d="M520 320 L760 300 L800 420 L560 460 Z"/>
  </g>

  <!-- Waldflaechen -->
  <g fill="#1c5238" opacity="0.6">
    <ellipse cx="150" cy="240" rx="120" ry="52"/>
    <ellipse cx="690" cy="240" rx="110" ry="46"/>
  </g>

  <!-- Gewaesser -->
  <path d="M-20 420 C 160 380, 300 470, 470 430 C 620 396, 720 460, 820 430" fill="none" stroke="#2f6d8a" stroke-width="10" opacity="0.55" stroke-linecap="round"/>

  <!-- Strassen -->
  <g stroke="#cbbf9e" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M-20 250 C 180 232, 300 300, 420 268 C 560 232, 680 292, 820 262" stroke-width="9"/>
    <path d="M400 -20 C 380 120, 440 200, 410 280 C 384 350, 430 430, 410 520" stroke-width="7"/>
    <path d="M120 520 C 200 420, 260 380, 400 268" stroke-width="4" opacity="0.7"/>
    <path d="M700 40 C 620 140, 520 200, 410 262" stroke-width="4" opacity="0.7"/>
  </g>

  <!-- Standortmarke -->
  <g transform="translate(400 250)">
    <circle r="58" fill="#45a870" opacity="0.16"/>
    <circle r="34" fill="#45a870" opacity="0.24"/>
    <path d="M0 -26 C 12 -26 22 -16 22 -4 C 22 12 0 30 0 30 C 0 30 -22 12 -22 -4 C -22 -16 -12 -26 0 -26 Z" fill="#ffffff"/>
    <circle cy="-5" r="7.5" fill="#12452f"/>
  </g>
</svg>
